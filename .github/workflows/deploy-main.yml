name: Deploy Production

# Fires only after the CI workflow *completes successfully* on main.
# The "production" GitHub Environment can additionally be configured with
# required reviewers (Settings → Environments → production → Protection
# rules) so a human approves before this job runs — recommended.
#
# Required repo secrets:  VERCEL_TOKEN, VERCEL_ORG_ID
# Required "production" environment secrets: VERCEL_PROJECT_ID, SUPABASE_DB_URL
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Push database migrations
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy to Vercel
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
