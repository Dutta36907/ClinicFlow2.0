name: CI

# Runs on every PR into preproduction or main, and on pushes to main (so a
# direct push there, not just a PR, still gets checked before deploy-main
# runs). Pushes to preproduction are checked by deploy-preprod.yml's own
# `checks` job instead — it needs to be push-triggered directly rather than
# via workflow_run (see that file), so it re-runs these checks itself.
on:
  pull_request:
    branches: [main, preproduction]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        # Advisory only for now — a pre-existing @tanstack/react-router /
        # router-plugin peer-version mismatch surfaces ~7 type errors
        # confined to src/routes/api/public/* and sitemap.xml.ts's `server:`
        # route option. Doesn't affect the actual `vite build` (no type
        # checking there), but isn't fixed yet — see docs/CI_CD_SETUP.md.
        # Flip to blocking once that's resolved: drop `continue-on-error`.
        continue-on-error: true
        run: bun run typecheck

      - name: Build
        run: bun run build
