name: Deploy Preproduction

# Triggered directly on push (not via workflow_run on the CI workflow):
# workflow_run always resolves its YAML from the default branch (main),
# so a workflow_run trigger here would silently ignore changes made on
# preproduction. `checks` is the gate instead — `deploy` only runs if it
# passes, so a direct push still can't deploy broken code.
#
# Required repo secrets:  VERCEL_TOKEN, VERCEL_ORG_ID
# Required "preproduction" environment secrets: VERCEL_PROJECT_ID, SUPABASE_DB_URL
on:
  push:
    branches: [preproduction]

concurrency: deploy-preproduction

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        # Advisory only for now, see docs/CI_CD_SETUP.md.
        continue-on-error: true
        run: bun run typecheck

      - name: Build
        run: bun run build

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: preproduction
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preproduction

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Push database migrations
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy to Vercel
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
